<!DOCTYPE html>
<html>
<head>
    <title>Order Successful</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;}
        body{
            background:#f3f4f6;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:30px;
        }

        .card{
            width:100%;
            max-width:560px;
            background:white;
            border-radius:16px;
            padding:30px;
            box-shadow:0 10px 25px rgba(0,0,0,0.18);
            text-align:center;
            border:1px solid #e5e7eb;
        }

        .tick{
            width:72px;
            height:72px;
            margin:0 auto 14px;
            border-radius:50%;
            background:#16a34a;
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            font-size:40px;
            font-weight:900;
        }

        h2{
            font-size:30px;
            font-weight:900;
            color:#111827;
            margin-bottom:10px;
        }

        p{
            color:#6b7280;
            font-size:16px;
            margin-bottom:18px;
        }

        .btns{
            display:flex;
            gap:12px;
            justify-content:center;
            flex-wrap:wrap;
        }

        .btn{
            text-decoration:none;
            padding:12px 18px;
            border-radius:12px;
            font-weight:900;
            display:inline-block;
        }

        .btn-primary{
            background:#ff5722;
            color:white;
        }

        .btn-primary:hover{
            background:#e64a19;
        }

        .btn-outline{
            background:white;
            border:2px solid #111827;
            color:#111827;
        }

        .btn-outline:hover{
            background:#111827;
            color:white;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="tick">✓</div>
    <h2>Order Placed Successfully!</h2>
    <p>Your food order has been received. It will be delivered soon 🍽️</p>

    <div class="btns">
        <a class="btn btn-primary" href="/">Back to Menu</a>
        <a class="btn btn-outline" href="/cart/">View Cart</a>
    </div>
</div>

</body>
</html>
